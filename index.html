<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACO LABO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F5F3EE;
    --surface: #FFFFFF;
    --accent: #5C7A8A;
    --text-primary: #1A1A1A;
    --text-secondary: #7A7A72;
    --text-muted: #B0AEA6;
    --border: rgba(0,0,0,0.08);
    --live-bg: #E8F0EC;
    --live-color: #2D6A4F;
    --live-border: rgba(45,106,79,0.25);
    --soon-bg: #F0EFEA;
    --soon-color: #9A9890;
    --soon-border: rgba(0,0,0,0.1);
  }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 4rem 2rem 2rem;
  }

  .brand {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--text-muted);
    margin-bottom: 1.5rem;
    text-transform: uppercase;
  }

  .tagline {
    font-size: clamp(18px, 3vw, 22px);
    font-weight: 300;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
  }

  .section-header {
    text-align: center;
    padding: 3rem 2rem 2.5rem;
  }

  .section-sub {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.12em;
    margin-bottom: 8px;
  }

  .section-title {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 300;
    color: var(--text-primary);
    letter-spacing: -0.02em;
  }

  .section-title strong {
    font-weight: 500;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    max-width: 800px;
    margin: 0 auto;
    border: 1px solid var(--border);
  }

  .app-card {
    background: var(--surface);
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transition: background 0.2s;
  }

  .app-card:hover {
    background: #FAFAF8;
  }

  .app-num {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    margin-bottom: 14px;
  }

  .app-icon-wrap {
    width: 72px;
    height: 72px;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 14px;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .app-icon-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 16px;
  }

  .app-icon-placeholder {
    width: 72px;
    height: 72px;
    border-radius: 16px;
    background: var(--bg);
    border: 1px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
    flex-shrink: 0;
  }

  .app-icon-placeholder svg {
    width: 24px;
    height: 24px;
    opacity: 0.2;
  }

  .app-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 4px;
    line-height: 1.3;
  }

  .app-desc {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 14px;
    line-height: 1.5;
    flex: 1;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 20px;
    text-decoration: none;
    border: 1px solid;
    transition: opacity 0.2s;
    white-space: nowrap;
  }

  .badge-live {
    background: var(--live-bg);
    color: var(--live-color);
    border-color: var(--live-border);
  }

  .badge-live:hover {
    opacity: 0.75;
  }

  .badge-soon {
    background: var(--soon-bg);
    color: var(--soon-color);
    border-color: var(--soon-border);
  }

  .support-section {
    text-align: center;
    padding: 2.5rem 2rem 1rem;
  }

  .support-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 500;
    color: var(--accent);
    text-decoration: none;
    padding: 10px 24px;
    border: 1px solid var(--accent);
    border-radius: 24px;
    transition: background 0.2s, color 0.2s;
  }

  .support-link:hover {
    background: var(--accent);
    color: #fff;
  }

  footer {
    text-align: center;
    padding: 3rem 2rem;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.15em;
  }

  @media (max-width: 600px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .app-card { padding: 1.5rem 1rem; }
  }

  @media (max-width: 380px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">HACO LABO</div>
  <div class="tagline">HACOを開けると、ちょっと便利。</div>
</header>

<div class="section-header">
  <div class="section-sub">小さなアプリの玩具箱</div>
  <div class="section-title"><strong>HACO</strong> 図鑑</div>
</div>

<div class="grid" id="app-grid">
</div>

<div class="support-section">
  <a class="support-link" href="https://hacosupport-zj4zwoua.manus.space/" target="_blank">【サポート】</a>
</div>

<footer>HACO LABO.</footer>

<script>
async function fetchAppIcon(appleId) {
  try {
    const res = await fetch(`https://itunes.apple.com/lookup?id=${appleId}&country=jp`);
    const data = await res.json();
    if (data.results && data.results.length > 0) {
      return data.results[0].artworkUrl100 || null;
    }
  } catch (e) {}
  return null;
}

function placeholderIcon() {
  return `<div class="app-icon-placeholder">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="3" width="18" height="18" rx="4" stroke="currentColor" stroke-width="1.5"/>
    </svg>
  </div>`;
}

async function buildCard(app) {
  const card = document.createElement('div');
  card.className = 'app-card';

  const isWeb = app.type === 'web';

  const iconHtml = (app.status === 'live' && app.appleId)
    ? `<div class="app-icon-wrap"><img src="" alt="${app.name}" id="icon-${app.appleId}" /></div>`
    : placeholderIcon();

  let badgeHtml;
  if (isWeb) {
    if (app.download) {
      badgeHtml = `<a class="badge badge-live" href="${app.download}" download>Download ↓</a>`;
    } else if (app.url) {
      badgeHtml = `<a class="badge badge-live" href="${app.url}" target="_blank">Web App ↗</a>`;
    } else {
      badgeHtml = `<span class="badge badge-soon">Web App / Soon</span>`;
    }
  } else {
    badgeHtml = app.status === 'live'
      ? `<a class="badge badge-live" href="https://apps.apple.com/jp/app/id${app.appleId}" target="_blank">App Store ↗</a>`
      : `<span class="badge badge-soon">Coming Soon...</span>`;
  }

  card.innerHTML = `
    <div class="app-num">${app.id}</div>
    ${iconHtml}
    <div class="app-name">${app.name}</div>
    <div class="app-desc">${app.desc}</div>
    ${badgeHtml}
  `;

  return card;
}

async function init() {
  const res = await fetch('apps.json');
  const apps = await res.json();
  const grid = document.getElementById('app-grid');

  for (const app of apps) {
    const card = await buildCard(app);
    grid.appendChild(card);
  }

  for (const app of apps) {
    if (app.status === 'live' && app.appleId) {
      const iconUrl = await fetchAppIcon(app.appleId);
      const img = document.getElementById(`icon-${app.appleId}`);
      if (img && iconUrl) {
        img.src = iconUrl;
      } else if (img) {
        img.parentElement.outerHTML = placeholderIcon();
      }
    }
  }
}

init();
</script>
</body>
</html>
